name: Deploy 麻薯 (Cloudflare, team-only)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: mashu-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MASHU_ADMIN_EMAILS: ${{ vars.MASHU_ADMIN_EMAILS }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip until Cloudflare secrets exist
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "No CLOUDFLARE_API_TOKEN secret yet; skipping."; echo "go=no" >> "$GITHUB_OUTPUT"; else echo "go=yes" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.go == 'yes'
        with:
          node-version: 22
      - name: Install
        if: steps.check.outputs.go == 'yes'
        working-directory: gate
        run: npm ci
      - name: Build site
        if: steps.check.outputs.go == 'yes'
        run: gate/build.sh
      - name: Cloudflare setup (D1, login, Access app)
        if: steps.check.outputs.go == 'yes'
        working-directory: gate
        run: node setup.mjs
      - name: Migrate database
        if: steps.check.outputs.go == 'yes'
        working-directory: gate
        run: npx wrangler d1 migrations apply mashu --remote -c wrangler.deploy.json
      - name: Deploy worker
        if: steps.check.outputs.go == 'yes'
        working-directory: gate
        run: npx wrangler deploy -c wrangler.deploy.json
