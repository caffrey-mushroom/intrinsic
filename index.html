<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>INTRINSIC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet"/>
  <style>
    :root { --bg:#faf9f5; --text:#141413; --muted:#73726c; --border:#e8e6dc; --accent:#c96442; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); }
    main { max-width: 720px; margin: 0 auto; padding: 72px 24px 96px; }
    .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
    h1 { font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 48px; line-height: 1.1; margin: 0 0 16px; }
    .lede { font-size: 17px; line-height: 1.55; color: var(--muted); margin: 0 0 40px; max-width: 36em; }
    .card { display:block; text-decoration:none; color:inherit; border:1px solid var(--border); border-radius: 12px; padding: 20px 22px; background:#fff; transition: border-color .15s ease; }
    .card:hover { border-color: var(--accent); }
    .card h2 { font-family: Newsreader, Georgia, serif; font-weight: 500; font-size: 24px; margin: 0 0 8px; }
    .card p { margin:0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .card .go { margin-top: 14px; color: var(--accent); font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">INTRINSIC</p>
    <h1>Research hub</h1>
    <p class="lede">Summary page for INTRINSIC tracking. Individual datasets live on subpages.</p>
    <a class="card" href="./ramp-ai-index/">
      <h2>Ramp AI Index</h2>
      <p>Interactive dashboard for adoption, spend per employee, and model market share.</p>
      <div class="go">Open dashboard →</div>
    </a>
  </main>
</body>
</html>
