<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<title>The Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Noto+Serif+SC:wght@500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#FAF9F5; --hover:#F3F1EA; --soft:#EFEDE6; --rule:#E6E3D9;
  --text:#141413; --muted:#5F5E59; --faint:#8A887F;
  --slate-100:#E3E7ED; --slate-200:#C8D0DA; --slate-300:#ABB7C8; --slate-400:#90A1B6; --slate-500:#7189A7; --slate-600:#5E728D; --slate-700:#4D5E74; --slate-800:#364456; --navy:#022B46;
  --gray-350:#A6A6A6; --edge:#D9D9D9;
  --serif:Newsreader, "Noto Serif SC", "Noto Serif CJK SC", "Songti SC", STSong, Georgia, serif;
  --sans:Inter, "PingFang SC", "Noto Sans SC", "Noto Sans CJK SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --fs-display:40px; --fs-title:20px; --fs-body:15px; --fs-note:12.5px;
  --s1:8px; --s2:16px; --s3:24px; --s4:32px; --s6:48px; --s8:64px;
  --radius:8px; --hair:1px solid var(--rule);
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1F1E1D; --hover:#282725; --soft:#2E2D2A; --rule:#3A3935; --text:#F0EEE6; --muted:#B3B0A6; --faint:#85827A;
  --slate-100:#2F3540; --navy:#C8D0DA; --edge:#3A3935; --slate-800:#C8D0DA; --slate-700:#ABB7C8; } }
:root[data-theme="dark"]{
  --bg:#1F1E1D; --hover:#282725; --soft:#2E2D2A; --rule:#3A3935; --text:#F0EEE6; --muted:#B3B0A6; --faint:#85827A;
  --slate-100:#2F3540; --navy:#C8D0DA; --edge:#3A3935; --slate-800:#C8D0DA; --slate-700:#ABB7C8; }
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); font-size:var(--fs-body); line-height:1.7; -webkit-font-smoothing:antialiased}
a{color:inherit; text-decoration:none}
:focus-visible{outline:2px solid var(--slate-500); outline-offset:3px; border-radius:4px}
.mbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 94%, transparent); backdrop-filter:blur(8px); border-bottom:var(--hair)}
.mbar-in{max-width:none; margin:0; padding:0 var(--s3); height:56px; display:flex; align-items:center; gap:var(--s2)}
.mark{font-family:var(--serif); font-weight:500; font-size:19px}
.crumb{color:var(--muted); display:flex; align-items:center; gap:var(--s2); white-space:nowrap}
.crumb::before{content:""; width:1px; height:16px; background:var(--rule)}
.back{display:flex; align-items:center; gap:var(--s2); color:var(--muted); white-space:nowrap}
.back::after{content:""; width:1px; height:16px; background:var(--rule)}
.back:hover{color:var(--text)}
.sp{flex:1}
.page{max-width:none; margin:0; padding:var(--s3) var(--s3) var(--s2)}
.ptitle{font-family:var(--serif); font-weight:500; font-size:var(--fs-display); line-height:1.15; letter-spacing:-.012em; margin:0}
.bar{display:flex; flex-wrap:wrap; gap:var(--s2); align-items:center; justify-content:space-between}
.bar input{font:inherit; font-size:14px; width:180px; color:var(--text); background:var(--bg); border:var(--hair); border-radius:var(--radius); padding:6px 12px; width:200px}
.wrap{position:relative; margin-top:var(--s3)}
.stage{position:relative; overflow:hidden; height:calc(100vh - 150px); min-height:520px; background:var(--bg)}
.stage svg{width:100%; height:100%; display:block; cursor:grab}
.stage svg:active{cursor:grabbing}
.ctl{display:flex; gap:var(--s1); align-items:center}
.seg{display:flex; border:var(--hair); border-radius:var(--radius); overflow:hidden}
.seg button{font:inherit; font-size:13.5px; color:var(--muted); background:var(--bg); border:0; padding:6px 14px; cursor:pointer}
.seg button+button{border-left:var(--hair)}
.seg button.on{background:var(--soft); color:var(--text)}
.blob{fill-opacity:0; stroke-opacity:0; transition:fill-opacity .4s, stroke-opacity .4s; cursor:pointer}
.secmode .blob{fill-opacity:.38; stroke-opacity:.9}
.secmode .blob:hover{fill-opacity:.55}
.seclk{stroke:var(--slate-300); stroke-linecap:round; opacity:0; transition:opacity .4s; pointer-events:none}
.secmode .seclk{opacity:.55}
.secmode .lk{opacity:0}
.secmode .nd circle{r:3px; opacity:.5}
.secmode .nd text{opacity:0}
.secmode .sect{fill:var(--text); font-size:30px}
.secmode .sect.sm{font-size:22px}
.tools{position:absolute; right:12px; bottom:12px; display:flex; gap:6px}
.tools button{font:inherit; font-size:12.5px; color:var(--muted); background:var(--bg); border:var(--hair); border-radius:var(--radius); padding:4px 10px; cursor:pointer}
.tools button:hover{background:var(--hover); color:var(--text)}
.lk{stroke:var(--edge); stroke-width:.8}
.lk.hub{stroke-opacity:.0}
.lk.hi{stroke:var(--slate-500); stroke-width:1.6}
.nd text{font-size:12px; fill:var(--muted); paint-order:stroke; stroke:var(--bg); stroke-width:3px; stroke-linejoin:round; pointer-events:none}
.sect{font-family:var(--serif); font-size:24px; fill:var(--slate-200); pointer-events:none; transition:opacity .2s}
.fade .sect{opacity:.35}
.nd.hi text, .nd.sel text{fill:var(--text)}
.nd.hubn text{display:none}
.nd circle{cursor:pointer; stroke-width:1.4; transition:opacity .2s}
.nd.sel circle{stroke:var(--navy); stroke-width:3}
.nd,.lk{transition:opacity .2s}
.fade .nd:not(.hi){opacity:.12}
.fade .lk:not(.hi){opacity:.06}
.panel{position:absolute; top:var(--s2); right:0; width:320px; max-height:calc(100% - 32px); overflow:auto; background:var(--bg); border-left:var(--hair); padding:0 0 0 var(--s3)}
.panel:empty{display:none}
.panel .k{font-size:var(--fs-note); color:var(--muted)}
.panel h2{font-family:var(--serif); font-weight:500; font-size:28px; line-height:1.2; margin:4px 0 0}
.panel .role{color:var(--muted); margin-top:4px}
.panel h3{font-size:var(--fs-note); font-weight:600; color:var(--muted); margin:var(--s3) 0 4px; text-transform:none}
.panel ul{list-style:none; padding:0; margin:0}
.panel li{font-size:14px; padding:5px 0; border-bottom:var(--hair); display:flex; gap:10px; justify-content:space-between}
.panel li .rl{color:var(--muted); font-size:12.5px; text-align:right}
.panel li a, .panel .nb{cursor:pointer}
.panel li a:hover, .panel .nb:hover{text-decoration:underline; text-underline-offset:3px}
.panel .empty{color:var(--faint); font-size:13.5px}
.panel .intro p{margin:0 0 var(--s1); font-size:14px; color:var(--muted)}
.panel .intro b{color:var(--text); font-weight:600}
.src{font-size:var(--fs-note); color:var(--muted); margin-top:var(--s2)}
.mt{border-collapse:collapse; width:100%; margin-top:var(--s2); font-size:13px; font-variant-numeric:tabular-nums}
.mt th{font-weight:600; color:var(--muted); text-align:right; padding:4px 0 4px 8px; border-bottom:var(--hair)}
.mt td{text-align:right; padding:5px 0 5px 8px; border-bottom:var(--hair)}
.mt td:first-child,.mt th:first-child{text-align:left; padding-left:0; color:var(--muted)}
.mt .cur{color:var(--text); font-weight:600}
.ctl{flex-wrap:wrap; justify-content:flex-end}
@media (max-width:960px){
  .stage{height:72vh; min-height:480px}
  .panel{position:static; width:auto; max-height:none; border-left:0; padding:var(--s2) 0 0}
}
@media (max-width:760px){
  :root{--fs-display:32px}
  .mbar-in{padding:0 var(--s2)}
  .page{padding:var(--s3) var(--s2) var(--s6)}
}
</style>
</head>
<body>
<header class="mbar"><div class="mbar-in">
  <a class="back" href="../" aria-label="返回首页">←&#8201;返回</a>
  <a class="mark" href="../" aria-label="Mushroom 首页"><span>Mushroom</span></a>
    <span class="sp"></span>
</div></header>
<main class="page">
  <div class="bar">
    <h1 class="ptitle">The Map</h1>
    <span class="ctl"><span class="seg" id="yr"></span><span class="seg" id="sz"><button data-m="mc" class="on">市值</button><button data-m="rev">AI 收入</button></span><span class="seg" id="seg"><button data-m="co" class="on">公司</button><button data-m="sec">行业</button></span><input id="q" type="search" placeholder="搜索" aria-label="搜公司"/></span>
  </div>
  <div class="wrap">
    <div class="stage" id="stage">
      <svg id="svg" role="img" aria-label="AI 产业链图谱"></svg>
      <div class="tools"><button id="fit">复位</button></div>
    </div>
    <aside class="panel" id="panel"></aside>
  </div>
  <p class="src" id="src"></p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module">
const DATA=await (await fetch('data.json',{cache:'no-store'})).json();
let yi=DATA.years.indexOf(2026), sizeBy='mc';
const fmt=v=>v>=100?`$${Math.round(v)}bn`:v>=10?`$${v.toFixed(0)}bn`:`$${v.toFixed(1)}bn`;
const val=n=>sizeBy==='mc'?n.mc:(n.rev?n.rev[yi]:0);
const rad=n=>sizeBy==='mc'?2.5+.34*Math.sqrt(n.mc||0):2.5+.9*Math.sqrt(n.rev?n.rev[yi]:0);
const ROW={ent:0,lab:1,cloud:2,power:3,chip:3,odm:2.6,fab:4,pkg:4,grid:4,cap:5,sub:6,mat:6};
const NROW=6;
const COL={odm:'--slate-400',pkg:'--slate-300',grid:'--gray-350',sub:'--slate-300',mat:'--gray-350',ent:'--slate-300',lab:'--slate-800',cloud:'--slate-600',power:'--gray-350',chip:'--slate-500',fab:'--slate-700',cap:'--slate-400'};
const SECT={g_soft:'Software',g_svc:'Software',g_sec:'Security',g_app:'AI Apps',g_frontier:'Frontier Labs',g_open:'Open Models',g_infer:'Inference',
  g_hyper:'Hyperscalers',g_neo:'Neoclouds',g_cncloud:'China Cloud',g_turbine:'Power',g_onsite:'Power',g_dc:'Power',
  g_xpu:'Compute',g_mem:'Memory',g_optic:'Optical & Networking',g_foundry:'Foundry',g_memfab:'Foundry',g_odm:'Servers',g_rack:'Rack Components',g_pcb:'PCB & Substrate',g_osat:'Packaging & Test',g_fiber:'Photonics Materials',g_grid:'Grid & Turbine Parts',g_sub:'SemiCap Subsystems',g_mat:'Materials',g_wfe:'SemiCap',g_back:'SemiCap',g_cncap:'SemiCap'};
const SX={'Software':-.25,'Security':.2,'AI Apps':.5,'Frontier Labs':-.1,'Open Models':.25,'Inference':.6,'Hyperscalers':-.3,'Neoclouds':.05,'China Cloud':.35,'Power':.62,
  'Compute':-.38,'Memory':.02,'Optical & Networking':.3,'Foundry':-.15,'SemiCap':-.05,'Servers':.02,'Rack Components':.22,'PCB & Substrate':.18,'Packaging & Test':-.4,'Photonics Materials':.42,'Grid & Turbine Parts':.65,'SemiCap Subsystems':-.25,'Materials':.2};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const layerName=Object.fromEntries(DATA.layers.map(l=>[l.id,l]));
// nodes: companies + group hubs
const nodes=DATA.nodes.map(d=>({...d,type:'co'}));
nodes.forEach(n=>{ n.sec=n.sec||SECT[n.g]||'Other'; if(ROW[n.layer]===undefined) ROW[n.layer]=3; if(SX[n.sec]===undefined) SX[n.sec]=0; });
[...new Set(nodes.map(n=>n.sec))].forEach(sc=>{ const m=nodes.find(n=>n.sec===sc); nodes.push({id:'#'+sc,name:sc,sec:sc,g:m.g,layer:m.layer,type:'hub'}); });
const byId=Object.fromEntries(nodes.map(n=>[n.id,n]));
const links=DATA.links.map(l=>({source:l.s,target:l.t,l:l.l,f:l.f,type:'rel'}));
nodes.filter(n=>n.type==='co').forEach(n=>links.push({source:'#'+n.sec,target:n.id,type:'hub'}));
const deg={}; DATA.links.forEach(l=>{deg[l.s]=(deg[l.s]||0)+1; deg[l.t]=(deg[l.t]||0)+1;});
nodes.forEach(n=>{ n.deg=deg[n.id]||0; n.r=n.type==='hub'?0:rad(n); });
const adj={}; nodes.forEach(n=>adj[n.id]=new Set([n.id]));
links.forEach(l=>{adj[l.source].add(l.target); adj[l.target].add(l.source);});

const stage=document.getElementById('stage'), svg=d3.select('#svg');
let SW=stage.clientWidth, SH=stage.clientHeight;
const root=svg.append('g'), blobG=root.append('g'), secLG=root.append('g'), linkG=root.append('g'), nodeG=root.append('g'), secG=root.append('g');
let spread=1, mode='co';
const SP=175; // vertical spacing between chain steps (soft)
const ty=n=>(ROW[n.layer]-2.5)*SP*spread;
const tx=n=>SX[n.sec]*1800*spread;
const link=linkG.selectAll('line').data(links).join('line').attr('class',d=>'lk'+(d.type==='hub'?' hub':''));
const lw=d=>d.f?.6+.32*Math.sqrt(d.f[yi]):.6;
link.style('stroke-width',lw);
nodes.sort((a,b)=>(b.r||0)-(a.r||0));
const node=nodeG.selectAll('g').data(nodes).join('g').attr('class',d=>'nd'+(d.type==='hub'?' hubn':'')+(d.deg>=6?' big':''));
function paint(){
  node.select('circle').attr('fill',d=>d.priv?css('--bg'):css(COL[d.layer])).attr('stroke',d=>css(COL[d.layer]));
}
node.append('circle').attr('r',d=>d.type==='hub'?0:d.r);
node.append('text').attr('text-anchor','middle').attr('y',d=>d.r+12).text(d=>d.type==='hub'?d.name:d.id);
paint();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paint);

const sim=d3.forceSimulation(nodes)
  .force('link',d3.forceLink(links).id(d=>d.id).distance(d=>d.type==='hub'?34:95).strength(d=>d.type==='hub'?.7:.06))
  .force('charge',d3.forceManyBody().strength(d=>d.type==='hub'?-30:-170).distanceMax(500))
  .force('collide',d3.forceCollide(d=>d.type==='hub'?0:d.r+14))
  .force('x',d3.forceX(tx).strength(d=>d.type==='hub'?.5:.05))
  .force('y',d3.forceY(ty).strength(d=>d.type==='hub'?.5:.09))
  .stop();
nodes.forEach(n=>{n.x=tx(n)+(Math.random()-.5)*60; n.y=ty(n)+(Math.random()-.5)*60;});
for(let i=0;i<400;i++) sim.tick();
const secs=[...new Set(nodes.filter(n=>n.type==='co').map(n=>n.sec))];
const secT=secG.selectAll('text').data(secs).join('text').attr('class','sect').attr('text-anchor','middle').text(d=>d);
const secOf=Object.fromEntries(nodes.map(n=>[n.id,n.sec]));
const pc={}; DATA.links.forEach(l=>{ const a=secOf[l.s], b=secOf[l.t]; if(a===b) return; const k=[a,b].sort().join('|'); pc[k]=(pc[k]||0)+1; });
const secLinks=Object.entries(pc).map(([k,c])=>{ const [a,b]=k.split('|'); return {a,b,c}; });
const secL=secLG.selectAll('line').data(secLinks).join('line').attr('class','seclk').attr('stroke-width',d=>1+Math.sqrt(d.c)*1.6);
const secLayer=Object.fromEntries(secs.map(sc=>[sc,nodes.find(n=>n.sec===sc&&n.type==='co').layer]));
const blob=blobG.selectAll('circle').data(secs).join('circle').attr('class','blob').on('click',(e,sc)=>{e.stopPropagation(); select('#'+sc);});
function paintBlobs(){ blob.attr('fill',sc=>css(COL[secLayer[sc]])).attr('stroke',sc=>css(COL[secLayer[sc]])); }
paintBlobs(); matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintBlobs);
const SP_={}; let secMc={}; function sums(){ secMc={}; nodes.forEach(n=>{ if(n.type==='co') secMc[n.sec]=(secMc[n.sec]||0)+val(n); }); } sums();
const secR=sc=>22+(sizeBy==='mc'?.6:1.4)*Math.sqrt(secMc[sc]||0);
function draw(){
  secs.forEach(sc=>{ const m=nodes.filter(n=>n.type==='co'&&n.sec===sc); const x=d3.mean(m,n=>n.x), y=d3.mean(m,n=>n.y);
    const r=mode==='sec'?secR(sc):d3.max(m,n=>Math.hypot(n.x-x,n.y-y))+18; SP_[sc]={x,y,r,top:d3.min(m,n=>n.y)}; });
  secT.attr('x',sc=>SP_[sc].x).attr('y',sc=>mode==='sec'?SP_[sc].y+6:SP_[sc].top-22).classed('sm',sc=>SP_[sc].r<70);
  blob.attr('cx',sc=>SP_[sc].x).attr('cy',sc=>SP_[sc].y).attr('r',sc=>SP_[sc].r);
  secL.attr('x1',d=>SP_[d.a].x).attr('y1',d=>SP_[d.a].y).attr('x2',d=>SP_[d.b].x).attr('y2',d=>SP_[d.b].y);
  link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y).attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
  node.attr('transform',d=>`translate(${d.x},${d.y})`);
}
draw();
sim.on('tick',draw).alphaDecay(.03);
const zoom=d3.zoom().scaleExtent([.2,5]).on('zoom',e=>{root.attr('transform',e.transform); svg.classed('zin',e.transform.k>1.25);});
svg.call(zoom).on('dblclick.zoom',null);
function home(){ const xs=nodes.map(n=>n.x), ys=nodes.map(n=>n.y);
  const x0=Math.min(...xs)-40,x1=Math.max(...xs)+40,y0=Math.min(...ys)-60,y1=Math.max(...ys)+40;
  const k=Math.min(SW/(x1-x0),SH/(y1-y0),1.6); return d3.zoomIdentity.translate(SW/2-k*(x0+x1)/2,SH/2-k*(y0+y1)/2).scale(k); }
function fit(){ svg.transition().duration(400).call(zoom.transform,home()); }
svg.call(zoom.transform,home());
document.getElementById('fit').onclick=()=>{fit(); select(null);};
function setMode(m){ if(m===mode) return; mode=m; spread=m==='sec'?1.15:1;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  svg.classed('secmode',m==='sec'); select(null);
  sim.force('x').x(tx); sim.force('y').y(ty);
  sim.force('link').strength(d=>d.type==='hub'?(m==='sec'?1:.7):(m==='sec'?.003:.06)).distance(d=>d.type==='hub'?(m==='sec'?secR(d.source.sec)*.45:34):95);
  sim.force('collide').radius(d=>m==='sec'?(d.type==='hub'?secR(d.sec)+18:4):(d.type==='hub'?0:d.r+14));
  sim.force('charge').strength(d=>m==='sec'?(d.type==='hub'?-900:-4):(d.type==='hub'?-30:-170));
  sim.force('x').strength(d=>d.type==='hub'?.5:(m==='sec'?.01:.05)); sim.force('y').strength(d=>d.type==='hub'?.5:(m==='sec'?.01:.09));
  sim.stop(); const old=nodes.map(n=>[n.x,n.y]);
  sim.alpha(1); for(let i=0;i<350;i++) sim.tick();
  if(m==='sec'){ const hub=Object.fromEntries(nodes.filter(n=>n.type==='hub').map(n=>[n.sec,n])); const cnt={};
    nodes.filter(n=>n.type==='co').forEach(n=>{ const h=hub[n.sec], tot=nodes.filter(o=>o.type==='co'&&o.sec===n.sec).length, j=cnt[n.sec]=(cnt[n.sec]||0)+1;
      const a=j*2.39996, rr=secR(n.sec)*.78*Math.sqrt((j-.5)/tot); n.x=h.x+rr*Math.cos(a); n.y=h.y+rr*Math.sin(a); }); }
  const nw=nodes.map(n=>[n.x,n.y]); const target=home();
  nodes.forEach((n,i)=>{n.x=old[i][0]; n.y=old[i][1];});
  svg.transition().duration(900).call(zoom.transform,target);
  const tm=d3.timer(el=>{ const t=d3.easeCubicInOut(Math.min(el/900,1));
    nodes.forEach((n,i)=>{ n.x=old[i][0]+(nw[i][0]-old[i][0])*t; n.y=old[i][1]+(nw[i][1]-old[i][1])*t; }); draw();
    if(t>=1){ tm.stop(); } }); }
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
const yrEl=document.getElementById('yr');
DATA.years.forEach((y,i)=>{ const b=document.createElement('button'); b.textContent=y>=2026?`${String(y).slice(2)}e`:String(y); b.className=i===yi?'on':''; b.onclick=()=>{ yi=i; update(); }; yrEl.appendChild(b); });
document.querySelectorAll('#sz button').forEach(b=>b.onclick=()=>{ sizeBy=b.dataset.m; update(); });
function update(){
  yrEl.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('on',i===yi));
  document.querySelectorAll('#sz button').forEach(b=>b.classList.toggle('on',b.dataset.m===sizeBy));
  nodes.forEach(n=>{ if(n.type==='co') n.r=rad(n); }); sums();
  node.select('circle').transition().duration(500).attr('r',d=>d.type==='hub'?0:d.r);
  node.select('text').transition().duration(500).attr('y',d=>d.r+12);
  link.transition().duration(500).style('stroke-width',lw);
  sim.force('collide').radius(d=>mode==='sec'?(d.type==='hub'?secR(d.sec)+18:4):(d.type==='hub'?0:d.r+14));
  if(mode==='co'){ sim.alpha(.3).restart(); } else { draw(); }
  if(sel) select(sel);
}
document.getElementById('src').textContent=`Model: ${DATA.model} · 生成 ${DATA.built}${DATA.issues.length?' · Check: '+DATA.issues.join(', '):''} · 市值为估算`;
window.select=id=>select(id);


node.call(d3.drag()
  .on('start',(e,d)=>{ if(!e.active) sim.alphaTarget(.15).restart(); d.fx=d.x; d.fy=d.y; })
  .on('drag',(e,d)=>{ d.fx=e.x; d.fy=e.y; })
  .on('end',(e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

let sel=null;
function focus(id){
  const st=d3.select('#stage');
  if(!id){ svg.classed('fade',false); node.classed('hi',false); link.classed('hi',false); return; }
  const nb=adj[id];
  svg.classed('fade',true);
  node.classed('hi',d=>nb.has(d.id));
  link.classed('hi',d=>d.source.id===id||d.target.id===id);
}
node.on('mouseenter',(e,d)=>focus(d.id)).on('mouseleave',()=>focus(sel)).on('click',(e,d)=>{e.stopPropagation(); select(d.id);});
svg.on('click',()=>select(null));

const panel=document.getElementById('panel');
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function intro(){ panel.innerHTML=''; }
function li(o,dir){ const m=byId[o]; return `<li><a class="nb" data-id="${esc(o)}">${esc(m.type==='hub'?m.name:o)}</a><span class="rl">${esc(dir)}</span></li>`; }
function model(d){
  if(!d.rev||(!Math.max(...d.rev)&&!Math.max(...d.spend))) return '';
  const yl=y=>y>=2026?String(y).slice(2)+'e':String(y);
  const yh=DATA.years.map((y,i)=>`<th${i===yi?' class="cur"':''}>${yl(y)}</th>`).join('');
  const row=(lab,a)=>Math.max(...a)?`<tr><td>${lab}</td>${a.map((v,i)=>`<td${i===yi?' class="cur"':''}>${v?fmt(v):'–'}</td>`).join('')}</tr>`:'';
  const fl=(arr,t)=>{ const a=arr.filter(x=>x[1][yi]>0.05); return a.length?`<h3>${t} (${yl(DATA.years[yi])})</h3><ul>${a.map(x=>`<li><a class="nb" data-id="${esc(x[0])}">${esc(x[0])}</a><span class="rl">${fmt(x[1][yi])}</span></li>`).join('')}</ul>`:''; };
  return `<table class="mt"><tr><th></th>${yh}</tr>${row('AI 收入',d.rev)}${row('AI 支出',d.spend)}</table>${fl(d.fin,'钱从哪来')}${fl(d.fout,'钱流向哪')}`;
}
function select(id){
  sel=id; node.classed('sel',d=>d.id===id); focus(id);
  if(!id){ intro(); return; }
  const d=byId[id];
  if(d.type==='hub'){
    const mem=nodes.filter(n=>n.type==='co'&&n.sec===d.sec);
    panel.innerHTML=`<div class="k">${esc(layerName[d.layer].name)}</div><h2>${esc(d.name)}</h2><h3>${mem.length} 家公司</h3><ul>${mem.map(m=>li(m.id,m.role)).join('')}</ul>`;
  } else {
    const up=DATA.links.filter(l=>l.t===id), dn=DATA.links.filter(l=>l.s===id);
    const res=d.res.map(r=>`<li><a href="../research/${esc(r[0])}">${esc(r[1])}</a><span class="rl">${esc(r[2])}</span></li>`).join('');
    const nts=d.notes.map(r=>`<li><a href="../notes/${esc(r[0])}/">${esc(r[1])}</a><span class="rl">${esc(r[2])}</span></li>`).join('');
    panel.innerHTML=`<div class="k">${esc(layerName[d.layer].name)} · ${esc(d.sec)}${d.priv?' · 私有':''}</div>
      <h2>${esc(d.id)}</h2><div class="role">${esc(d.role)}</div>${model(d)}
      <h3>客户 / 买方 (${up.length})</h3>${up.length?`<ul>${up.map(l=>li(l.s,l.l)).join('')}</ul>`:'<div class="empty">暂无</div>'}
      <h3>供应商 / 卖方 (${dn.length})</h3>${dn.length?`<ul>${dn.map(l=>li(l.t,l.l)).join('')}</ul>`:'<div class="empty">暂无</div>'}
      <h3>站内研究 (${d.nres})</h3>${res?`<ul>${res}</ul>`:'<div class="empty">还没有</div>'}
      <h3>Notes (${d.nnotes}${d.nnotes>d.notes.length?'，显示最近 '+d.notes.length+' 篇':''})</h3>${nts?`<ul>${nts}</ul>`:'<div class="empty">还没有</div>'}`;
  }
  panel.querySelectorAll('.nb').forEach(a=>a.onclick=()=>{select(a.dataset.id); center(a.dataset.id);});
}
function center(id){ const d=byId[id]; const t=d3.zoomTransform(svg.node()); const k=Math.max(t.k,1.2);
  svg.transition().duration(450).call(zoom.transform,d3.zoomIdentity.translate(SW/2-d.x*k,SH/2-d.y*k).scale(k)); }
intro();

// search
const q=document.getElementById('q');
q.addEventListener('keydown',e=>{ if(e.key!=='Enter') return; const v=q.value.trim().toLowerCase(); if(!v) return;
  const m=nodes.filter(n=>n.type==='co').find(n=>n.id.toLowerCase()===v)||nodes.find(n=>n.id.toLowerCase().startsWith(v))||nodes.find(n=>(n.role||n.name||'').toLowerCase().includes(v));
  if(m){ select(m.id); center(m.id); } });
q.addEventListener('input',()=>{ const v=q.value.trim().toLowerCase(); if(!v){focus(sel);return;}
  const hit=new Set(nodes.filter(n=>n.id.toLowerCase().includes(v)||(n.role||'').toLowerCase().includes(v)).map(n=>n.id));
  svg.classed('fade',true); node.classed('hi',d=>hit.has(d.id)); link.classed('hi',false); });

window.addEventListener('resize',()=>{ if(stage.clientWidth===SW) return; SW=stage.clientWidth; SH=stage.clientHeight; svg.call(zoom.transform,home()); });
</script>
</body>
</html>
